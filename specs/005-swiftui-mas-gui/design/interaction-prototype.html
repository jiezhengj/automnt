<style>

<aside class="review"><strong>设计审阅工具 · 不属于产品界面</strong><p>虚构 .example 内存数据；无网络、配置、认证、挂载或服务操作。HTML 只证明流程表达，原生外观和系统能力仍待真实验收。</p><div class="tools"><label>场景 <select id="scene"><option value="normal">已有配置</option><option value="many">五服务器 × 六共享</option><option value="discovery">首次有可添加共享</option><option value="empty">首次无目标</option><option value="readError">配置读取失败</option><option value="approval">后台待批准</option><option value="states">主动弹出 / 未选择 / 位置不符</option><option value="offline">第一服务器不可达</option></select></label><label>下次写入 <select id="saveMode"><option value="success">成功</option><option value="failure">失败</option><option value="conflict">并发冲突</option></select></label><button id="narrow">切换窄窗口</button><button id="notification">模拟通知点击</button><button id="reset">重置</button></div><p id="reviewResult" role="status"></p></aside>
<div class="app" id="app"><header><img src="app-icon-1024.png" alt=""><strong>Automnt</strong><button id="add">添加共享…</button><button id="evaluate">立即尝试自动挂载</button><button id="refresh">刷新状态</button><button id="settings">设置…</button><button id="menu">菜单栏</button><button id="about">关于</button><button id="help">帮助</button></header><div id="summary" class="summary"></div><div id="feedback" role="status" aria-live="polite"></div><main id="main"></main></div><dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<script>
'use strict';
const $=s=>/^#[^ >:[\]]+$/.test(s)?document.getElementById(s.slice(1)):document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let serverParameters={},shares=[],order=[],aliases={},hosts={},indexes={},selected=null,stage='servers',query='',revision=0,undo=null,results=[],lastTime='',backend='active',busy=false,dragHost=null,returnFocus=null,draft=null,scrolls={},navScroll=0;
let prefs={automatic:true,recovery:true,menu:false,login:false,sound:true,notification:'notDetermined',attempts:3,interval:1000,window:10000};
const host=s=>new URL(s.url).hostname.toLowerCase(),shareName=s=>s.name||decodeURIComponent(new URL(s.url).pathname.slice(1)),serverName=h=>aliases[h]||h;
function validURL(v){try{const u=new URL(v),p=decodeURIComponent(u.pathname).split('/').filter(Boolean);return u.protocol==='smb:'&&u.hostname&&p.length===1&&p[0]!=='.'&&p[0]!=='..'&&!u.username&&!u.password&&!u.search&&!u.hash&&!v.includes('?')&&!v.includes('#')}catch{return false}}
function identity(v){const u=new URL(v);return u.hostname.toLowerCase()+':'+(u.port||445)+'/'+decodeURIComponent(u.pathname.slice(1))}
function pathKey(v){const a=[];for(const p of v.trim().split('/')){if(!p||p==='.')continue;if(p==='..')a.pop();else a.push(p)}return '/'+a.join('/')}
function error(){const m=$('#saveMode').value;return m==='failure'?'未能保存，已恢复保存值。':m==='conflict'?'配置已在其他入口更改，请核对最新值后重试。':null}
function tell(t){$('#feedback').textContent=t}
function mutate(fn){const e=error();if(e){tell(e);return false}fn();revision++;return true}
function seed(scene='normal'){busy=false;serverParameters={};shares=[];order=[];aliases={};hosts={};indexes={};results=[];lastTime='';selected=null;stage='servers';query='';scrolls={};navScroll=0;undo=null;revision++;prefs={automatic:!['empty','discovery'].includes(scene),recovery:true,menu:false,login:false,sound:true,notification:'notDetermined',attempts:3,interval:1000,window:10000};backend=scene==='approval'?'approval':prefs.automatic?'active':'stopped';if(!['empty','readError'].includes(scene))for(let h=0;h<(scene==='many'?5:3);h++){const server='server'+(h+1)+'.example';aliases[server]=['办公室 NAS','家中 NAS','测试服务器','素材服务器','归档服务器'][h];for(let v=0;v<(scene==='many'?6:3);v++){const managed=scene!=='discovery'&&v<(scene==='many'?4:2);shares.push({id:server+'-'+v,url:'smb://'+server+'/Share'+(v+1),name:'共享 '+(v+1),location:'/Volumes/Share'+(v+1),actual:'/Volumes/Share'+(v+1),managed,auto:true,status:'已挂载'})}if(scene!=='discovery')order.push(server)}if(scene==='states'){shares[0].status='已弹出';shares[0].actual='';shares[1].status='位置不符';shares[1].actual='/Volumes/Share2-1';shares[3].status='此次未选择';shares[3].actual=''}if(scene==='offline'){shares.filter(s=>host(s)==='server1.example').forEach(s=>{s.status='服务器不可达';s.actual=''})}render();tell('')}
function retain(){const c=$('.content'),n=$('.servers');if(c)scrolls[c.dataset.host]=c.scrollTop;if(n)navScroll=n.scrollTop}
function render(){retain();const focus=document.activeElement?.id,all=[...new Set(shares.map(host))];order=order.filter(h=>shares.some(s=>s.managed&&host(s)===h));for(const h of all)if(shares.some(s=>s.managed&&host(s)===h)&&!order.includes(h))order.push(h);if(!all.includes(selected))selected=all[0]||null;$('#evaluate').disabled=!prefs.automatic||backend!=='active'||busy||!order.length;$('#menu').hidden=!prefs.menu;
$('#summary').innerHTML=busy?'正在检查并挂载…':backend==='approval'?'需要允许后台运行 <button id="permission">打开系统设置</button>':backend==='unavailable'?'无法确认自动挂载状态 <button id="repair">检查后台状态</button>':prefs.automatic?'自动挂载已开启'+(results.some(r=>r.selected)?' · 最近一次选择：'+esc(serverName(results.find(r=>r.selected).host)):'')+(lastTime?' · '+lastTime+' <button id="result">查看结果</button>':''):'自动挂载已关闭'+(order.length?' <button id="enable">开启自动挂载</button>':'');
$('#permission')?.addEventListener('click',()=>show('允许后台运行','<p>请在系统设置的登录项中允许 Automnt 后返回。</p><button id="approved">重新核对</button>',()=>{$('#approved').onclick=()=>{backend='active';close();render();tell('后台许可已核对。')}}));$('#repair')?.addEventListener('click',()=>diagnostics());$('#enable')?.addEventListener('click',()=>{if(mutate(()=>{prefs.automatic=true;backend='approval'})){render();tell('需要允许后台运行；配置已保留。')}});$('#result')?.addEventListener('click',resultView);
if($('#scene').value==='readError'){$('#main').innerHTML='<div class="summary"><h1>无法读取已有配置</h1><p>已有目标未被覆盖。请检查配置访问或版本兼容。</p><button id="readRetry">重试读取</button> <button id="readDiag">查看诊断…</button></div>';$('#readRetry').onclick=()=>tell('仍无法读取；未创建另一份配置。');$('#readDiag').onclick=diagnostics;return}
$('#main').innerHTML='<div class="split" data-stage="'+stage+'"><nav class="servers" aria-label="服务器"><label>搜索<input id="search" placeholder="服务器或共享名称" value="'+esc(query)+'"></label><div id="serverList"></div></nav><div class="content" data-host="'+esc(selected||'')+'"></div></div>';
const list=$('#serverList');for(const [title,hs] of [['已管理',order],['可添加',all.filter(h=>!order.includes(h))]]){const visible=hs.filter(h=>!query||serverName(h).toLowerCase().includes(query.toLowerCase())||shares.some(s=>host(s)===h&&shareName(s).toLowerCase().includes(query.toLowerCase())));if(!visible.length)continue;list.insertAdjacentHTML('beforeend','<h2>'+title+'</h2>');for(const h of visible){const ss=shares.filter(s=>host(s)===h),r=results.find(r=>r.host===h),bad=ss.filter(s=>['认证失败','位置不符','连接失效','恢复失败'].includes(s.status)).length;const b=document.createElement('button');b.className='server';b.id='server-'+h;b.dataset.host=h;b.setAttribute('aria-current',h===selected);b.draggable=order.includes(h)&&!query;b.innerHTML=esc(serverName(h))+'<small>已管理 '+ss.filter(s=>s.managed).length+' · 可添加 '+ss.filter(s=>!s.managed).length+(bad?' · 问题 '+bad:'')+'</small>'+(r?'<small>'+esc(r.status)+'</small>':'');b.onclick=()=>{selected=h;stage='shares';render()};b.ondragstart=()=>{dragHost=h;b.classList.add('dragging')};b.ondragend=()=>{dragHost=null;render()};b.ondragover=e=>{if(dragHost&&order.includes(h)&&!query){e.preventDefault();b.classList.add('drop')}};b.ondragleave=()=>b.classList.remove('drop');b.ondrop=e=>{e.preventDefault();move(dragHost,order.indexOf(h))};b.onkeydown=e=>{if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)&&order.includes(h)){e.preventDefault();move(h,order.indexOf(h)+(e.key==='ArrowUp'?-1:1))}};list.append(b)}}
if(order.length)list.insertAdjacentHTML('beforeend','<p class="muted"><small>按顺序选择首个可达服务器。拖动调整；键盘使用 Option＋方向键。'+(query?' 搜索中不可排序。':'')+'</small></p>');if(undo)list.insertAdjacentHTML('beforeend','<button id="undo">撤销顺序调整</button>');$('#undo')?.addEventListener('click',()=>{if(revision!==undo.revision){tell('此后配置已有更改，无法直接撤销。');return}if(mutate(()=>{order=undo.order;undo=null})){render();tell('顺序已恢复；现有挂载不变。')}});
$('#search').oninput=e=>{query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};
const c=$('.content');if(!selected)c.innerHTML='<h1>让 SMB 共享自动可用</h1><p>添加共享后，在登录和网络恢复时自动挂载。</p><button id="emptyAdd">添加共享…</button><p class="muted">也可以先通过 Finder“连接服务器…”连接，再回来添加。</p>';else{const r=results.find(r=>r.host===selected);c.innerHTML='<button class="back" id="back">服务器</button><div class="actions"><h1>'+esc(serverName(selected))+'</h1><button id="rename">重命名</button><button id="serverSettings">服务器设置…</button></div>'+(order.includes(selected)?'<label class="toggle"><input id="hostAuto" type="checkbox" '+(hosts[selected]!==false?'checked':'')+'> 自动挂载此服务器的共享</label><p class="muted">关闭后，不再自动挂载此服务器的共享；已经挂载的共享仍可使用。</p>':'')+(r&&!r.selected?'<p class="muted">'+esc(r.reason||r.status)+'</p>':'');for(const [label,managed]of [['已管理',true],['可添加',false]]){const ss=shares.filter(s=>host(s)===selected&&s.managed===managed&&(!query||shareName(s).toLowerCase().includes(query.toLowerCase())||serverName(selected).toLowerCase().includes(query.toLowerCase())));if(!ss.length)continue;c.insertAdjacentHTML('beforeend','<h2>'+label+'</h2>');for(const s of ss){c.insertAdjacentHTML('beforeend','<div class="row"><div class="identity"><button class="name" id="detail-'+s.id+'">'+esc(shareName(s))+'</button><small>'+esc(s.managed?s.status:'Finder 已连接')+'</small></div><button id="action-'+s.id+'">'+(s.managed?(s.status==='已挂载'?'在 Finder 中打开':s.status==='已弹出'?'挂载':'查看原因'):'添加')+'</button></div>');$('#detail-'+s.id).onclick=()=>details(s.id);$('#action-'+s.id).onclick=()=>s.managed?(s.status==='已挂载'?tell('在 Finder 中打开 '+shareName(s)):s.status==='已弹出'?mount(s):details(s.id)):addCandidate(s)}}}
$('#emptyAdd')?.addEventListener('click',()=>edit());$('#back')?.addEventListener('click',()=>{stage='servers';render()});$('#serverSettings')?.addEventListener('click',serverSettings);$('#rename')?.addEventListener('click',()=>{const h=selected;const heading=c.querySelector('h1');heading.innerHTML='<input id="alias" value="'+esc(serverName(h))+'" aria-label="服务器名称">';$('#alias').focus();$('#alias').select();$('#alias').onkeydown=e=>{if(e.key==='Escape')render();if(e.key==='Enter'){const v=e.target.value.trim();if(!v){tell('名称不能为空。');return}if(mutate(()=>aliases[h]=v))render()}}});$('#hostAuto')?.addEventListener('change',e=>{mutate(()=>hosts[selected]=e.target.checked);render()});$('.servers').scrollTop=navScroll;c.scrollTop=scrolls[selected]||0;if(focus&&document.getElementById(focus))document.getElementById(focus).focus({preventScroll:true})}
function move(h,index){if(!h||query||index<0||index>=order.length)return;const old=[...order];if(mutate(()=>{order=order.filter(x=>x!==h);order.splice(index,0,h)})){undo={order:old,revision};render();tell('顺序已保存，影响下一轮评估；现有挂载不变。')}else render()}
function addCandidate(s){if(shares.some(o=>o.managed&&o.id!==s.id&&(identity(o.url)===identity(s.url)||(host(o)===host(s)&&pathKey(o.location)===pathKey(s.location))))){tell('同服务器地址或位置重复。');return}if(mutate(()=>s.managed=true)){render();$('#detail-'+s.id)?.focus({preventScroll:true});tell('已添加。'+(!prefs.automatic?'可开启自动挂载。':'保存不代表已核对可用。'))}}
function show(title,body,bind){returnFocus=document.activeElement;$('#dialog').innerHTML='<h1 id="dialogTitle">'+esc(title)+'</h1>'+body+'<div class="actions"><button id="close">关闭</button></div>';if(!$('#dialog').open)$('#dialog').showModal();$('#close').onclick=cancel;bind?.()}
function close(){draft=null;$('#dialog').close();returnFocus?.isConnected&&returnFocus.focus()}
function cancel(){if(draft&&JSON.stringify(draft.read())!==draft.baseline){const values=draft.read(),original=draft.original;const reopen=draft.capture?draft.capture(values):()=>editWithValues(original,values);draft=null;show('放弃未提交输入？','<p>未提交内容不会改变已保存配置。</p><button id="discard">放弃</button><button id="keep">继续编辑</button>',()=>{$('#discard').onclick=close;$('#keep').onclick=reopen;$('#close').onclick=reopen;$('#close').textContent='继续编辑'});return}close()}
function mount(s){if(busy)return;if(s.actual&&s.actual!==s.location){tell('已有挂载位置与约定不符，请先核对实际位置；未移动或弹出现有卷。');return}if(shares.some(o=>o!==s&&o.actual===s.location)){s.status='位置被占用';render();tell('约定位置已由另一共享使用，未弹出或覆盖它。');return}s.status='已挂载';s.actual=s.location;render();tell('该共享已完成挂载；服务器顺序不变。')}
function details(id){const s=shares.find(x=>x.id===id);if(!s)return;const why={'已弹出':'当前网络会话内不自动重新挂载；网络上下文变化或重新登录后恢复。','此次未选择':'本轮选择前面的服务器，未对此目标发起自动挂载。','位置不符':'实际位置与约定位置不同，使用约定路径的任务可能无法访问。','认证失败':'请在 Finder 中重新连接服务器，完成系统认证后返回。','服务器不可达':'请检查网络与服务器；下一有效系统事件会再次评估。'}[s.status]||'按实际状态核对共享是否可用。';show(shareName(s),'<p>'+esc(s.status)+'</p><p>'+why+'</p><dl><dt>约定位置</dt><dd>'+esc(s.location)+'</dd><dt>实际位置</dt><dd>'+esc(s.actual||'未挂载')+'</dd><dt>SMB 地址</dt><dd>'+esc(s.url)+'</dd><dt>最近观测</dt><dd>'+esc(lastTime||'打开窗口时')+'</dd></dl><label class="toggle"><input id="shareAuto" type="checkbox" '+(s.auto?'checked':'')+'> 自动挂载此共享</label><p class="muted">关闭后已有挂载保留，自动挂载还受服务器和全局控制。</p><div class="actions"><button id="finder" '+(s.status!=='已挂载'?'disabled':'')+'>在 Finder 中打开</button><button id="mount" '+(s.status==='已挂载'||busy?'disabled':'')+'>挂载</button><button id="eject" '+(!s.actual||busy?'disabled':'')+'>弹出</button></div><section><button id="edit">编辑地址与位置…</button> <button id="remove" class="danger">移除管理…</button></section><p class="muted">索引防护：'+(indexes[host(s)]?'已尝试，系统效果无法确认':'未启用')+'</p><button id="diag">查看诊断…</button>',()=>{$('#shareAuto').onchange=e=>{mutate(()=>s.auto=e.target.checked);render();details(id)};$('#finder').onclick=()=>tell('在 Finder 中打开 '+shareName(s));$('#mount').onclick=()=>{mount(s);details(id)};$('#eject').onclick=()=>{s.status='已弹出';s.actual='';render();details(id);tell('已弹出，本次会话不自动重挂。')};$('#edit').onclick=()=>edit(s);$('#diag').onclick=()=>diagnostics(s);$('#remove').onclick=()=>show('移除 '+shareName(s)+' 的管理？','<p>保留当前挂载，不删除远程文件或系统登录信息。</p><button id="confirmRemove" class="danger">移除管理</button>',()=>{$('#confirmRemove').onclick=()=>{if(mutate(()=>s.managed=false)){close();render();tell('已移除管理，挂载保留。')}}})})}
function edit(original){const v=original||{url:'',name:'',location:''};show(original?'编辑共享':'添加共享','<label class="field">SMB 地址<input id="url" value="'+esc(v.url)+'" placeholder="smb://server.example/share"></label><label class="field">共享名称<input id="shareName" value="'+esc(v.name||'')+'"></label><label class="field">约定挂载位置<input id="location" value="'+esc(v.location)+'"></label><p class="muted">位置变化不会移动当前挂载，依赖旧路径的任务可能需要调整。</p><p id="formError" class="error" role="alert"></p><button id="save">'+(original?'保存':'添加')+'</button>',()=>{const read=()=>({url:$('#url').value.trim(),name:$('#shareName').value.trim(),location:$('#location').value.trim()});draft={original,read,baseline:JSON.stringify(read()),reopen:()=>editWithValues(original,read())};$('#url').oninput=()=>{if(!original&&validURL($('#url').value)){const n=decodeURIComponent(new URL($('#url').value).pathname.slice(1));$('#shareName').value=n;$('#location').value='/Volumes/'+n}};$('#save').onclick=()=>{const x=read(),err=!validURL(x.url)?'请输入不含登录信息的完整 SMB 地址。':!x.name||!x.location.startsWith('/')||pathKey(x.location)==='/'?'名称和有效挂载位置必填。':original&&host(original)!==new URL(x.url).hostname.toLowerCase()?'服务器地址请在服务器设置中修改，并核对所有受影响共享。':shares.some(o=>o.managed&&o!==original&&(identity(o.url)===identity(x.url)||(host(o)===new URL(x.url).hostname.toLowerCase()&&pathKey(o.location)===pathKey(x.location))))?'同服务器共享地址或位置冲突。':error();if(err){$('#formError').textContent=err;return}if(original)Object.assign(original,x);else shares.push({...x,id:'new-'+revision,managed:true,auto:true,status:'等待自动挂载',actual:''});revision++;close();render();tell('配置已保存；实际挂载状态单独核对。')};$('#close').textContent='取消'})}
function editWithValues(original,values){edit(original);$('#url').value=values.url;$('#shareName').value=values.name;$('#location').value=values.location;draft.baseline=JSON.stringify(original?{url:original.url,name:original.name,location:original.location}:{url:'',name:'',location:''})}
function serverSettings(){const h=selected;show(serverName(h)+' 设置','<dl><dt>地址</dt><dd>'+esc(h)+'</dd><dt>服务端口</dt><dd>'+(serverParameters[h]?.port||445)+'</dd><dt>探测时限</dt><dd>'+(serverParameters[h]?.timeout||1000)+' ms</dd></dl><button id="connection">编辑连接参数…</button><p class="muted">地址及连接参数修改须一次核对该服务器的全部共享。</p><label class="toggle"><input id="index" type="checkbox" '+(indexes[h]?'checked':'')+'> 尝试阻止 Spotlight 索引</label><p class="muted">作用于此服务器全部共享。可能限制搜索；不删除已有索引，也不能保证系统防护生效。</p>',()=>{$('#connection').onclick=()=>editServer(h);$('#index').onchange=e=>{mutate(()=>indexes[h]=e.target.checked);render();serverSettings()}})}
function editServer(h,values){const cfg=serverParameters[h]||{address:h,port:445,timeout:1000},initial=values||cfg;show('编辑服务器连接','<label class="field">服务器地址<input id="serverAddress" value="'+esc(initial.address)+'"></label><label class="field">端口<input id="serverPort" type="number" value="'+initial.port+'"></label><label class="field">探测时限（ms）<input id="serverTimeout" type="number" value="'+initial.timeout+'"></label><p>受影响共享：'+shares.filter(s=>host(s)===h&&s.managed).map(s=>esc(shareName(s))).join('、')+'</p><p class="muted">修改后重新核对目标；现有挂载不移动、不弹出。</p><p id="connectionError" class="error" role="alert"></p><button id="connectionSave">保存</button>',()=>{const read=()=>({address:$('#serverAddress').value.trim(),port:Number($('#serverPort').value),timeout:Number($('#serverTimeout').value)});draft={read,baseline:JSON.stringify(cfg),capture:v=>()=>editServer(h,v)};$('#connectionSave').onclick=()=>{const x=read();let u;try{u=new URL('smb://'+x.address+'/Probe')}catch{}const e=!u||u.hostname!==x.address.toLowerCase()||u.username||u.password||u.port||u.search||u.hash?'请输入有效主机地址，不含路径或登录信息。':!Number.isInteger(x.port)||x.port<1||x.port>65535||!Number.isInteger(x.timeout)||x.timeout<100||x.timeout>30000?'端口或时限无效。':x.address.toLowerCase()!==h&&shares.some(s=>s.managed&&host(s)===x.address.toLowerCase())?'该服务器已存在，不能自动合并。':error();if(e){$('#connectionError').textContent=e;return}const next=x.address.toLowerCase();for(const s of shares.filter(s=>host(s)===h)){const url=new URL(s.url);url.hostname=next;url.port=x.port===445?'':String(x.port);s.url=url.href;if(s.actual)s.status='需要重新核对'}order=order.map(v=>v===h?next:v);aliases[next]=aliases[h];hosts[next]=hosts[h];indexes[next]=indexes[h];serverParameters[next]=x;selected=next;revision++;close();render();tell('连接参数已保存；实际挂载仍需核对。')};$('#close').textContent='取消'})}
function settings(){show('设置','<section><h2>自动挂载</h2><label class="toggle"><input id="automatic" type="checkbox" '+(prefs.automatic?'checked':'')+'> 自动挂载</label><p>实际后台状态：'+esc({active:'已获准',approval:'待系统批准',stopped:'已停止',unavailable:'无法确认'}[backend])+'</p><p class="muted">关闭后已有挂载保留；退出界面后已开启的后台继续。</p><label class="toggle"><input id="recovery" type="checkbox" '+(prefs.recovery?'checked':'')+' '+(!prefs.automatic?'disabled':'')+'> 自动恢复</label><p class="muted">额外响应卷变化；关闭后仍在登录或网络变化时评估。</p></section><section><h2>菜单栏与登录</h2><label class="toggle"><input id="menuPref" type="checkbox" '+(prefs.menu?'checked':'')+'> 在菜单栏显示 Automnt</label><label class="toggle"><input id="login" type="checkbox" '+(prefs.login?'checked':'')+' '+(!prefs.menu?'disabled':'')+'> 登录时显示菜单栏</label><p class="muted">不打开主窗口，后台自动挂载不依赖菜单栏。</p></section><section><h2>通知</h2><p>'+({notDetermined:'通知尚未允许',allowed:'通知已允许',denied:'系统通知已关闭'}[prefs.notification])+'</p><button id="allow">'+(prefs.notification==='notDetermined'?'允许通知…':'打开通知设置…')+'</button><label class="toggle"><input id="sound" type="checkbox" '+(prefs.sound?'checked':'')+'> 通知声音</label><p class="muted">关闭声音仍可收到通知；实际呈现受系统与专注模式控制。</p></section><section><h2>高级</h2><label class="field">最多尝试次数（1–10）<input id="attempts" type="number" min="1" max="10" value="'+prefs.attempts+'"></label><label class="field">间隔（100–5000 ms）<input id="interval" type="number" min="100" max="5000" value="'+prefs.interval+'"></label><label class="field">评估窗口（1000–30000 ms）<input id="window" type="number" min="1000" max="30000" value="'+prefs.window+'"></label></section><section><h2>支持</h2><button id="diagnostic">查看诊断…</button> <button id="usage">使用帮助</button> <button id="privacy">支持与隐私</button> <button id="license">开源许可</button></section>',()=>{for(const [id,key]of [['automatic','automatic'],['recovery','recovery'],['menuPref','menu'],['login','login'],['sound','sound']])$('#'+id).onchange=e=>{mutate(()=>{prefs[key]=e.target.checked;if(key==='automatic')backend=prefs.automatic?'approval':'stopped';if(key==='menu'&&!prefs.menu)prefs.login=false});render();settings()};for(const [key,min,max]of [['attempts',1,10],['interval',100,5000],['window',1000,30000]])$('#'+key).onchange=e=>{const v=Number(e.target.value);if(Number.isInteger(v)&&v>=min&&v<=max)mutate(()=>prefs[key]=v);else tell('参数超出允许范围。');settings()};$('#allow').onclick=()=>{if(prefs.notification==='notDetermined'){prefs.notification='allowed';settings()}else tell('打开系统通知设置。')};$('#diagnostic').onclick=diagnostics;$('#usage').onclick=help;$('#privacy').onclick=privacy;$('#license').onclick=license})}
function evaluate(){if(busy||!prefs.automatic||backend!=='active')return;busy=true;results=[];render();queueMicrotask(()=>{let chosen=false;for(const h of order){const disabled=hosts[h]===false,offline=$('#scene').value==='offline'&&h==='server1.example',select=!chosen&&!disabled&&!offline;results.push({host:h,selected:select,status:disabled?'自动挂载已关闭':chosen?'未检查':offline?'无法连接':'本轮已选择',reason:chosen?'已选择前面的服务器，未检查此服务器。':undefined});if(select){chosen=true;for(const s of shares.filter(s=>s.managed&&host(s)===h&&s.auto&&s.status!=='已弹出')){if(s.actual&&s.actual!==s.location){s.status='位置不符';continue}if(shares.some(o=>o!==s&&o.actual===s.location&&o.status==='已挂载')){s.status='位置被占用';continue}s.status='已挂载';s.actual=s.location}}}lastTime=new Date().toLocaleTimeString();busy=false;render();tell('本轮评估已完成；共享失败不会切换到下一服务器。')})}
function resultView(){show('最近一次自动挂载',lastTime?'<p>'+esc(lastTime)+'</p>'+results.map(r=>'<p><strong>'+esc(serverName(r.host))+'</strong> · '+esc(r.status)+'</p>').join('')+'<p class="muted">所选服务器共享失败不继续选择后续服务器；现有其他挂载可能保留。</p>':'<p>尚无评估结果。</p>')}
function menu(){show('菜单栏',order.map(h=>'<section><h2>'+esc(serverName(h))+'</h2>'+shares.filter(s=>s.managed&&host(s)===h).map(s=>'<p>'+esc(shareName(s))+' · '+esc(s.status)+' <button data-target="'+s.id+'">查看详情</button></p>').join('')+'</section>').join('')+'<button id="menuOpen">打开 Automnt</button> <button id="menuSettings">设置…</button> <button id="hideMenu">隐藏菜单栏</button> <button id="stop">关闭自动挂载</button> <button id="quit">退出 Automnt</button>',()=>{document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>details(b.dataset.target));$('#menuOpen').onclick=close;$('#menuSettings').onclick=settings;$('#hideMenu').onclick=()=>{mutate(()=>{prefs.menu=false;prefs.login=false});close();render()};$('#stop').onclick=()=>{mutate(()=>{prefs.automatic=false;backend='stopped'});close();render()};$('#quit').onclick=()=>{close();tell('界面已退出；已开启的后台继续，现有挂载保留。')}})}
function diagnostics(s){show('诊断预览','<p>本机脱敏信息，不会自动上传。</p><pre>'+esc(JSON.stringify({version:'设计预览',backend,event:lastTime||'无记录',target:s?'目标 A':'整体',result:s?s.status:results.map(r=>r.status)},null,2))+'</pre><button id="export">导出…</button>',()=>{$('#export').onclick=()=>show('选择导出位置','<p>确认目的地后写入脱敏报告；取消不写文件。</p><button id="exportConfirm">导出</button>',()=>{$('#exportConfirm').onclick=()=>{close();tell('诊断导出完成。')}})})}
function help(){show('使用帮助','<h2>开始管理</h2><p>添加已连接共享，或输入完整 SMB 地址；开启后台后无需每天手动连接。</p><h2>未能自动挂载</h2><p>检查后台许可、服务器选择、网络及共享详情。认证请在 Finder 完成。</p><h2>主动弹出与路径</h2><p>本会话内主动弹出不自动重挂；约定位置不符时任务可能仍无法使用。</p><h2>退出</h2><p>退出 GUI 不停止已启用后台；停用请明确关闭自动挂载。</p>')}
function privacy(){show('支持与隐私','<p>配置在本机，系统处理 SMB 认证；应用不管理独立密码。目录权限按需请求，连接由目标服务器处理。</p><p>诊断由你预览并导出，不自动上传。支持链接和正式政策待发布前落实；此预览不提供虚假链接。</p><p>CLI 免费开源，商店 GUI 一次购买且独立可用。</p>')}
function license(){show('开源许可','<p>正式应用离线展示完整 MIT License 和适用第三方声明。此设计预览未装载正式许可正文，不作为许可交付验收。</p>')}
$('#add').onclick=()=>edit();$('#evaluate').onclick=evaluate;$('#refresh').onclick=()=>{render();tell('已读取当前状态，没有发起挂载。')};$('#settings').onclick=settings;$('#menu').onclick=menu;$('#about').onclick=()=>show('关于 Automnt','<p>SMB 共享自动挂载 · 完整产品设计预览</p><p>版本由产品唯一来源派生。CLI 免费开源，GUI 独立可用。</p><button id="aboutLicense">开源许可</button>',()=>$('#aboutLicense').onclick=license);$('#help').onclick=help;$('#narrow').onclick=()=>$('#app').classList.toggle('narrow');$('#scene').onchange=e=>seed(e.target.value);$('#reset').onclick=()=>{$('#scene').value='normal';$('#saveMode').value='success';seed()};$('#notification').onclick=()=>{const issues=shares.filter(s=>['位置不符','认证失败','恢复失败'].includes(s.status));if(issues.length===1){selected=host(issues[0]);stage='shares';render();details(issues[0].id)}else if(issues.length>1)show('当前挂载问题',issues.map(s=>'<p>'+esc(serverName(host(s))+' · '+shareName(s)+' · '+s.status)+' <button data-issue="'+s.id+'">查看</button></p>').join(''),()=>document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>details(b.dataset.issue)));else{render();tell('当前没有待处理的挂载问题；旧提醒已核对。')}};$('#dialog').addEventListener('cancel',e=>{e.preventDefault();cancel()});window.addEventListener('focus',()=>{if(!$('#dialog').open)render();$('#reviewResult').textContent='重新激活：只读取状态，不连接网络。'});seed();
</script></body></html>
